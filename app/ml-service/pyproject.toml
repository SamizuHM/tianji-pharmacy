[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",   # line too long (formatter handles it)
  "B008",   # function call in default arg (FastAPI Depends pattern)
  "RUF001", # ambiguous unicode char in string (Chinese fullwidth punctuation)
  "RUF002", # ambiguous unicode char in docstring
  "RUF003", # ambiguous unicode char in comment
  "RUF005", # list concat suggestion (stylistic preference)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
