# 直接公网暴露 Web 的替代启动文件。
# 使用方式：
#   docker compose -f docker-compose.public-web.yml up -d --build
#
# 安全边界：
# - 只有 web 映射到宿主机端口。
# - postgres、qdrant、ml-service 不配置 ports，只能被同一个 Compose 网络内的服务访问。
# - 云服务器安全组/防火墙仍需只放行 WEB_PUBLIC_PORT 对应端口，例如 80/443。

services:
  postgres:
    image: postgres:17-alpine
    container_name: tianji-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tianji_pharmacy}
      - POSTGRES_USER=${POSTGRES_USER:-tianji}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tianji_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: tianji-qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: tianji-ml
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen3.5-27b}
      - ROOT_DIR=/app
      - UPLOAD_DIR=./uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tianji-web
    ports:
      - "${WEB_PUBLIC_PORT:-80}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tianji}:${POSTGRES_PASSWORD:-tianji_password}@postgres:5432/${POSTGRES_DB:-tianji_pharmacy}?schema=public
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen3.5-27b}
      - UPLOAD_DIR=/app/uploads
      - AUTO_IMPORT_KNOWLEDGE_ON_FIRST_BOOT=${AUTO_IMPORT_KNOWLEDGE_ON_FIRST_BOOT:-true}
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_SERVICE_URL=http://ml-service:8001/embed
      - RERANK_SERVICE_URL=http://ml-service:8001/rerank
      - ML_SERVICE_URL=http://ml-service:8001
    volumes:
      - app_state:/app/data
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ml-service:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_storage:
  app_state:
  uploads_data:
