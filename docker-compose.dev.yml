# Local development override.
# Keep docker-compose.yml deployment-safe; only this file publishes Qdrant to localhost
# so host-run `pnpm dev` can access Qdrant via QDRANT_URL=http://127.0.0.1:6333.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
