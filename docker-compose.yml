services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: tianji-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: tianji-ml
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen3.5-vl}
      - ROOT_DIR=/app
      - UPLOAD_DIR=./uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tianji-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen3.5-vl}
      - UPLOAD_DIR=/app/uploads
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_SERVICE_URL=http://ml-service:8001/embed
      - RERANK_SERVICE_URL=http://ml-service:8001/rerank
      - ML_SERVICE_URL=http://ml-service:8001
    volumes:
      - db_data:/app/data
      - uploads_data:/app/uploads
    depends_on:
      qdrant:
        condition: service_started
      ml-service:
        condition: service_healthy

volumes:
  qdrant_storage:
  db_data:
  uploads_data:
